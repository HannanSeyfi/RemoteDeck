<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>RemoteDeck</title><link rel="icon" type="image/png" href="/icon.png"><link rel="apple-touch-icon" href="/icon.png"><link rel="stylesheet" href="/styles.css"><script src="/app.js?v=2" defer></script></head><body><main><header><div class="brand"><img src="/icon.png" alt=""><h1>RemoteDeck</h1></div><span id="connection">Disconnected</span></header><section id="pairing" hidden><h2>Pair this device</h2><p>Enter the code displayed by the Windows program.</p><form id="pair-form"><input id="device-name" maxlength="50" placeholder="Device name"><input id="pair-code" inputmode="numeric" maxlength="8" placeholder="8-digit code" required><button type="submit">Pair</button></form><p id="pair-error"></p></section><section id="controls" hidden><div id="touchpad"><span>Move with one finger</span><small>Tap: right click · Two-finger move: scroll · Two-finger tap: left click</small></div><label class="slider">Pointer speed<input id="sensitivity" type="range" min=".5" max="3" value="1.4" step=".1"></label><div class="button-row"><button data-click="left">Left click</button><button id="drag-button">Drag off</button><button data-click="right">Right click</button></div><h2>Media</h2><div class="button-grid"><button data-media="previous">Previous</button><button data-media="playPause">Play/Pause</button><button data-media="next">Next</button><button data-media="volumeDown">Volume −</button><button data-media="mute">Mute</button><button data-media="volumeUp">Volume +</button></div><h2>Keys</h2><div class="button-grid"><button data-key="escape">Esc</button><button data-key="space">Space</button><button data-key="enter">Enter</button><button data-key="left">←</button><button data-key="up">↑</button><button data-key="right">→</button><button data-key="backspace">Backspace</button><button data-key="down">↓</button><button data-key="delete">Delete</button></div><h2>Type text</h2><textarea id="text-input" maxlength="1000" placeholder="Text is typed into the focused Windows application"></textarea><button id="send-text">Send text</button></section></main></body></html>
